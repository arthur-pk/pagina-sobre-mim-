<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Meu site pessoal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <header>
        <h1> Contato </h1>
    </header>
    <section>
        <nav>
            <div class="container">
                <ul>
                    <li><a href="index.html">Home/Sobre mim</a></li>
                    <li><a href="portifolio.html">Portfólio</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </div>
        </nav>
        <article>
            <!-- Formulário de Contato -->
            <form action="#" method="POST" class="form-contato">
                <h2>Entre em Contato</h2>

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="comentario">Comentário / Mensagem:</label>
                    <textarea id="comentario" name="comentario" rows="5"
                        placeholder="Escreva sua mensagem ou comentário aqui..." required></textarea>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </article>
    </section>
    <footer>
        <p>&copy; 2026 Meu Site Pessoal. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
